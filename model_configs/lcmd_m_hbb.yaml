# Parameters
ch: 6
nc: 5  # number of classes

scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  #  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  #  s: [0.50, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
   m: [0.67, 0.75, 768]   # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  #  l: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  #  x: [1.00, 1.25, 512]   # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1 
  - [-2, 1, Multiin, [2]]  # 2

  - [-2, 1, Conv, [64, 3, 2]]  # 3-P1/2 
  - [-2, 1, Conv, [64, 3, 2]]

  - [-2, 1, Conv, [128, 3, 2]]  # 5-P2/4 
  - [-2, 1, Conv, [128, 3, 2]]

  - [-2, 3, C3k2, [128, False, 0.25]]  # 7  
  - [-2, 3, C3k2, [128, False, 0.25]]  # 8

  - [[-2, -1], 1, Concat_Novel, [1, 192]]  # 9

  - [-1, 1, Conv, [128, 3, 2]]  # 10-P3/8
  - [-3, 1, Conv, [128, 3, 2]]  # 11

  - [-2, 6, C3k2, [256, False, 0.25]]  # 12
  - [-2, 6, C3k2, [256, False, 0.25]]

  - [[-2, -1], 1, Concat_Novel, [1, 384]]  # 14

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 15-P4/16
  - [ -3, 1, Conv, [ 256, 3, 2 ] ]

  - [ -2, 6, C3k2, [ 256, True ] ]  # 17
  - [ -2, 6, C3k2, [ 256, True ] ]

  - [[-2, -1], 1, Concat_Novel, [1, 384]]  # 19

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 20-P5/32
  - [ -3, 1, Conv, [ 512, 3, 2 ] ]

  - [ -2, 3, C3k2, [ 512, True ] ]
  - [ -2, 3, C3k2, [ 512, True ] ]

  - [[-2, -1], 1, Concat_Novel, [1, 768]]  # 24

  - [-1, 1, SPPF, [512, 5]]
  - [-1, 1, C2PSA, [512]] # 26


 # YOLO11 head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 19], 1, Concat_Novel, [1, 768]]  # cat backbone P4
  - [-1, 3, C3k2, [512, False]]  # 29

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 14], 1, Concat_Novel, [1, 768]]  # cat backbone P3
  - [-1, 3, C3k2, [256, False]]  # 32 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 29], 1, Concat3, [1, 384]]  # cat head P4
  - [-1, 3, C3k2, [512, False]]  # 35 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 26], 1, Concat_Novel, [1, 768]]  # cat head P5
  - [-1, 3, C3k2, [1024, True]]  # 38 (P5/32-large)

  - [[32, 35, 38], 1, Detect, [nc]]  # Detect(P3, P4, P5)
